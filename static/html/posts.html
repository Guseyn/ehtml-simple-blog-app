<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
  <head>
    <title>Blog App</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Guseyn">
    <link rel="shortcut icon" type="image/png" href="/image/favicon.png">
    <link rel="stylesheet" href="/css/semanticss.css" type="text/css">
    <script type="importmap">
      {
        "imports": {
          "#ehtml/": "/js/ehtml/",
          "#ehtml/main": "/js/ehtml/main.js?v=1a6f54c9"
        }
      }
    </script>
    <script type="importmap">
      {
        "imports": {
          "#ehtml/": "/js/ehtml/",
          "#ehtml/main": "/js/ehtml/main.js?v=1a6f54c9"
        }
      }
    </script>
    <script type="module">import '#ehtml/main'</script>
  </head>

  <body>
    <template is="e-page-with-url" data-url-pattern="/html/posts.html?{page}&{size}">
      <template is="e-wrapper"
        data-src="/html/template.html"
        data-where-to-place="main"
        data-how-to-place="instead"
      >
        <main>
          <e-json 
            data-src="/posts?page=${urlParams.page}&size=${urlParams.size}"
            data-ajax-icon="#posts-ajax-icon"
            data-response-name="postsResponse"
            data-actions-on-response="
              mapToTemplate('#posts-template', postsResponse)
            "
            data-request-headers='${{
              "Content-Type": "application/json"
            }}'>
            <img class="ajax-icon" id="posts-ajax-icon" src="/images/ajax-icon.svg"/>
            
            <template id="posts-template" data-object-name="postsResponse">
              
              <template is="e-if" data-condition-to-display="
                ${postsResponse.body.posts.length === 0}
              ">
                <h2>No posts yet</h2>
              </template>
              
              <template
                is="e-if"
                data-condition-to-display="
                  ${postsResponse.body.posts.length !== 0}
                "
              >
                <h1>All Posts</h1>
                <template
                  is="e-for-each"
                  data-list-to-iterate="${postsResponse.body.posts}"
                  data-item-name="post">
                  <s-column>
                    <h2>
                      <a data-text="${post.title}" href="/html/post.html?id=${post.id}"></a>
                    </h2>
                    <b data-text="Email: ${post.userEmail}"></b>
                    <b data-text="Date: ${post.date}"></b>
                    <span data-text="${post.content}"></span>
                    <hr>
                  </s-column>  
                </template>
                
                <template
                  is="e-if" 
                  data-condition-to-display="
                  ${urlParams.page * 1 > 0 }"
                >
                  <a class="page-link"
                    href="/html/posts.html?page=${urlParams.page * 1 - 1}&size=${urlParams.size}">
                    << Show prev. page
                  </a>
                </template>

                <template is="e-if"
                  data-condition-to-display="${!postsResponse.body.lastPage}">
                  <a class="page-link"
                    href="/html/posts.html?page=${urlParams.page * 1 + 1}&size=${urlParams.size}">
                    Show next. page >>
                  </a>
                </template>
              </template>
            </template>
          </e-json>
        </main>
      </template>
    </template>
  </body>
</html>
