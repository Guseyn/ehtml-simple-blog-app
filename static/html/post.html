<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
  <head>
    <title>Blog App</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Guseyn">
    <link rel="shortcut icon" type="image/png" href="/image/favicon.png">
    <link rel="stylesheet" href="/css/semanticss.css" type="text/css">
    <script type="importmap">
      {
        "imports": {
          "#ehtml/": "/js/ehtml/",
          "#ehtml/main": "/js/ehtml/main.js?v=18dc6218"
        }
      }
    </script>
    <script type="module">import "#ehtml/main"</script>
    <style>
      .elm-error {
        color: red;
      }
      .message-error {
        box-shadow: none;
      }
    </style>
  </head>

  <body>
    <template is="e-page-with-url" data-url-pattern="/html/posts.html?{id}">
      <template is="e-wrapper"
        data-src="/html/template.html"
        data-where-to-place="main"
        data-how-to-place="instead"
      >
        <main>
          <e-json 
            data-src="/post?id=${urlParams.id}" 
            data-ajax-icon="#post-ajax-icon"
            data-response-name="postResponse"
            data-actions-on-response="
              mapToTemplate('#post-template', postResponse)
            ">
            <img class="ajax-icon" id="post-ajax-icon" src="/images/ajax-icon.svg"/>

            <template id="post-template" data-object-name="postResponse">

              <template is="e-if" data-condition-to-display="${postResponse.statusCode === 404}">
                <h2>Post Not Found</h2>
              </template>

              <template is="e-if" data-condition-to-display="
                ${postResponse.statusCode === 200}
              ">

                <div>
                  <s-column>
                    <h2 data-text="${postResponse.body.title}"></h2>
                    <b data-text="Email: ${postResponse.body.userEmail}"></b>
                    <b data-text="Date: ${postResponse.body.date}"></b>
                    <p data-text="${postResponse.body.content}"></p>
                  </s-column>
                </div>

                <div>
                  <s-column>
                    <b>Comments:</b>
                    <template is="e-if" data-condition-to-display="
                      ${postResponse.body.comments.length === 0}
                    ">
                      <h3 id="no-comments-message">No Comments yet. Be the first to comment.</h3>
                    </template>
                    <template
                      is="e-if"
                      data-condition-to-display="
                        ${postResponse.body.comments.length !== 0}
                      "
                    >
                      <template
                        is="e-for-each"
                        data-list-to-iterate="${postResponse.body.comments}"
                        data-item-name="comment"
                      >
                        <div>
                          <s-column>
                            <b data-text="${comment.userEmail}"></b>
                            <span data-text="${comment.content}"></span> 
                          </s-column>
                        </div>
                      </template>
                    </template>
                    <template
                      is="e-reusable"
                      id="comment-template"
                      data-object-name="comment">
                      <s-column>
                        <span data-text="${comment.userEmail}"></span> 
                        <span data-text="${comment.content}"></span> 
                      </s-column>
                    </template>
                    <form
                      is="e-form"
                      data-validation-error-message="Enter correct data into the form, please"
                      data-validation-error-class-for-message-box="form-message-error">
                      <label>
                        Your Email:
                        <input
                          id="email-input"
                          type="email" 
                          name="userEmail"
                          required
                          data-validation-pattern="email"
                          data-validation-bad-format-error-message="This is not proper email address"
                          data-validation-absence-error-message="Email is required"
                          data-validation-error-class-for-element="elm-error"
                          data-validation-error-class-for-message-box="message-error">
                      </label>
                      <label>
                        Comment:
                        <textarea 
                          id="comment-text" 
                          required
                          data-validation-error-class-for-element="elm-error"
                          data-validation-error-class-for-message-box="message-error"
                          name="content"></textarea>
                      </label>

                      <button
                        data-request-url="/comment/new?postId=${postResponse.body.id}"
                        data-request-method="POST"
                        data-request-headers='${{
                          "Content-Type": "application/json"
                        }}'
                        data-ajax-icon="#comment-ajax-icon"
                        data-response-name="response"
                        data-button-ajax-text="Sending..."
                        onclick="this.form.submit(this)"
                        data-actions-on-response="
                          mapToTemplate('#comment-template', response.body)
                          changeValueOf('#email-input', '')
                          changeValueOf('#comment-text', '')
                          hideElms('#no-comments-message')
                        "
                      >
                        Send
                      </button>
                      <img class="ajax-icon" id="comment-ajax-icon" src="/images/ajax-icon.svg"/>
                    </form>
                  </s-column>
                </div>
              </template>
            </template>
          </e-json>
        </main>
      </template>
    </template>
  </body>
</html>
